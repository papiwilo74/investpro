# NOTA: Si Render sigue usando la config cacheada (runtime: python),
# ve al Dashboard -> Blueprint -> "Sync Blueprint" para forzar la re-lectura.
# Esto activa el Dockerfile multi-stage con build del frontend incluido.

services:
  - type: web
    name: investpro
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_PAPER
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    healthCheckPath: /health
    autoDeploy: true
