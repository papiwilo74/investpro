[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "inversion-helper"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=1.5.1",
    "pandas>=3.0.3",
    "numpy>=2.5.1",
    "ta>=0.11.0",
    "plotly>=6.9.0",
    "scipy>=1.14.1",
    "scikit-learn>=1.9.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "alpaca-py>=0.43.5",
    "python-dotenv>=1.2.2",
    "schedule>=1.2.2",
    "loguru>=0.7.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "xgboost>=3.3.0",
    "vadersentiment>=3.3.2",
    "structlog>=26.1.0",
    "python-jose[cryptography]>=3.5.0",
    "prometheus-client>=0.25.0",
    "httpx>=0.28.1",
    "pytz>=2024.2",
    "pyarrow>=15.0",
]

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["tests*", "docs*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "mypy>=2.2.0",
    "ruff>=0.15.21",
    "bandit>=1.9.4",
    "alembic>=1.18.5",
    "streamlit>=1.59.1",
]
ml = [
    "torch>=2.5.1",
    "stable-baselines3>=2.5.0",
    "gymnasium>=1.1.1",
    "hmmlearn>=0.3.3",
]

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.github
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (black handles)
    "E402",  # module import not at top (needed for __init__)
    "RUF001",  # ambiguous unicode in strings
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
    "RUF006",  # create_task reference (intentional fire-and-forget)
    "RUF012",  # mutable class attributes (common config patterns)
    "RUF022",  # __all__ sorting (not critical)
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false
disallow_any_unimported = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["ta", "loguru", "yfinance", "alpaca-py", "prometheus_client", "structlog", "gymnasium", "hmmlearn", "stable_baselines3", "torch"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git"]
skips = ["B101", "B301", "B403", "B404", "B603", "B607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if __name__ == .__main__.:"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["N802", "N803", "N806"]
"ml/*.py" = ["N802", "N803", "N806", "N812", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["api", "app", "backtesting", "bot", "broker", "config", "data", "db", "frontend", "indicators", "logging_config", "ml", "portfolio"]
