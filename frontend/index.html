<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvestPro — Asesor de Inversiones</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          boxShadow: {
            'premium': '0 10px 30px -10px rgba(0, 0, 0, 0.05), 0 1px 3px 0 rgba(0, 0, 0, 0.02)',
            'premium-hover': '0 20px 40px -15px rgba(0, 0, 0, 0.1), 0 1px 10px 0 rgba(0, 0, 0, 0.03)',
            'dark-premium': '0 10px 30px -10px rgba(0, 0, 0, 0.5), 0 1px 3px 0 rgba(0, 0, 0, 0.1)',
          }
        }
      }
    }
  </script>
  
  <!-- CDNs Adicionales -->
  <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Local para específicos -->
  <link rel="stylesheet" href="/static/css/app.css?v=3">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col lg:flex-row transition-colors duration-300">

  <!-- Sidebar (Glass) -->
  <aside class="sidebar w-full lg:w-[320px] glass border-r p-6 flex flex-col fixed top-0 bottom-0 left-0 z-50 overflow-y-auto shadow-2xl">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-extrabold text-white text-lg shadow-lg">I</div>
      <span class="text-xl font-extrabold tracking-tight font-outfit bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent drop-shadow-md">InvestPro</span>
    </div>
    
    <!-- Input Ticker -->
    <div class="mb-6">
      <label for="ticker-input" class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2 font-outfit">Activo Principal</label>
      <div class="flex gap-2 relative">
        <input type="text" id="ticker-input" class="flex-1 px-4 py-2.5 text-sm font-bold rounded-xl bg-white/30 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all shadow-inner" placeholder="Ej: AAPL" value="AAPL">
        <button id="search-btn" class="px-4 bg-gradient-to-tr from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-sm rounded-xl transition-all shadow-md font-bold hover:shadow-lg hover:-translate-y-0.5">IR</button>
      </div>
    </div>
    
    <div class="h-px bg-slate-200 dark:bg-slate-800 my-4"></div>
    
    <!-- Watchlist -->
    <div class="mb-6">
      <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Watchlist rápida</label>
      <div id="watchlist" class="grid grid-cols-2 gap-2">
        <!-- Generado por JS -->
      </div>
    </div>
    
    <div class="h-px bg-slate-200 dark:bg-slate-800 my-4"></div>
    
    <!-- Selectors -->
    <div class="mb-5">
      <label for="period-select" class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Periodo histórico</label>
      <select id="period-select" class="w-full px-3 py-2.5 text-sm font-medium rounded-xl bg-white/50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-white focus:outline-none focus:border-blue-500 shadow-sm cursor-pointer hover:bg-white/80 dark:hover:bg-slate-900 transition-colors">
        <option value="1mo">1 Mes</option>
        <option value="3mo">3 Meses</option>
        <option value="6mo">6 Meses</option>
        <option value="1y" selected>1 Año</option>
        <option value="2y">2 Años</option>
        <option value="5y">5 Años</option>
      </select>
    </div>
    
    <div class="mb-5">
      <label for="interval-select" class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Intervalo de velas</label>
      <select id="interval-select" class="w-full px-3 py-2.5 text-sm font-medium rounded-xl bg-white/50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-white focus:outline-none focus:border-blue-500 shadow-sm cursor-pointer hover:bg-white/80 dark:hover:bg-slate-900 transition-colors">
        <option value="1d" selected>Diario</option>
        <option value="1wk">Semanal</option>
        <option value="1mo">Mensual</option>
      </select>
    </div>
    
    <div class="h-px bg-slate-200 dark:bg-slate-800 my-4"></div>
    
    <!-- Overlays -->
    <div class="mb-6">
      <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Overlays Gráfico</label>
      <div class="flex flex-col gap-3">
        <label class="flex items-center gap-3 text-xs text-slate-600 dark:text-slate-300 cursor-pointer hover:text-slate-900 dark:hover:text-white transition-colors">
          <input type="checkbox" id="show-sma" class="rounded text-blue-500 focus:ring-0 focus:ring-offset-0 bg-white dark:bg-slate-950 border-slate-300 dark:border-slate-700 w-4 h-4 cursor-pointer" checked>
          <span class="font-medium">SMA (20, 50, 200)</span>
        </label>
        <label class="flex items-center gap-3 text-xs text-slate-600 dark:text-slate-300 cursor-pointer hover:text-slate-900 dark:hover:text-white transition-colors">
          <input type="checkbox" id="show-bb" class="rounded text-blue-500 focus:ring-0 focus:ring-offset-0 bg-white dark:bg-slate-950 border-slate-300 dark:border-slate-700 w-4 h-4 cursor-pointer" checked>
          <span class="font-medium">Bollinger Bands</span>
        </label>
      </div>
    </div>
    
    <!-- Footer Sidebar -->
    <div class="mt-auto flex flex-col gap-3">
      <button id="theme-toggle" class="w-full py-2.5 text-sm font-bold rounded-xl bg-white/50 dark:bg-slate-800/50 hover:bg-white dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 shadow-sm hover:shadow-md transition-all cursor-pointer">Cambiar Tema</button>
      <span class="text-[10px] text-slate-400 font-medium text-center">InvestPro v2.0</span>
    </div>
  </aside>
  
  <!-- Contenido Principal -->
  <main class="flex-1 lg:ml-[320px] p-6 lg:p-8 w-full min-h-screen">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8 animate-fade-in-up">
      <div>
        <div class="flex items-baseline gap-3">
          <h1 id="header-ticker" class="text-3xl lg:text-4xl font-extrabold tracking-tight">AAPL</h1>
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">NASDAQ</span>
        </div>
        <div class="flex items-center gap-3 mt-2">
          <span id="header-price" class="text-2xl lg:text-3xl font-bold">$0.00</span>
          <span id="header-change" class="text-xs font-bold px-2 py-1 rounded">▲ 0.00%</span>
        </div>
      </div>
      
      <!-- Composite Score Widget -->
      <div class="glass rounded-2xl px-6 py-4 flex items-center gap-6 panel-hover-neon transition-all cursor-default">
        <div class="flex flex-col">
          <span class="text-[11px] font-extrabold text-slate-500 dark:text-slate-400 uppercase tracking-widest font-outfit">Score Compuesto</span>
          <span class="text-xs font-medium text-slate-400 mt-1">Indicador IA</span>
        </div>
        <div class="w-[64px] h-[64px] relative">
          <div id="composite-gauge" class="w-full h-full rounded-full flex items-center justify-center transition-all duration-500 shadow-inner">
            <div class="w-[50px] h-[50px] rounded-full bg-white dark:bg-slate-900 flex items-center justify-center shadow-sm">
              <span id="gauge-value" class="text-base font-extrabold text-slate-800 dark:text-white">0.00</span>
            </div>
          </div>
        </div>
      </div>
    </header>
    
    <!-- Navegación Tabs -->
    <nav class="tabs flex flex-wrap gap-2 glass p-1.5 rounded-2xl mb-8 shadow-sm">
      <button class="tab flex-1 min-w-[90px] py-2.5 px-4 text-xs lg:text-sm font-bold rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-white transition-all active hover:bg-slate-200/50 dark:hover:bg-slate-800/50" data-tab="advisor">Asesor</button>
      <button class="tab flex-1 min-w-[90px] py-2.5 px-4 text-xs lg:text-sm font-bold rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-white transition-all hover:bg-slate-200/50 dark:hover:bg-slate-800/50" data-tab="chart">Gráfico</button>
      <button class="tab flex-1 min-w-[90px] py-2.5 px-4 text-xs lg:text-sm font-bold rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-white transition-all hover:bg-slate-200/50 dark:hover:bg-slate-800/50" data-tab="signals">Señales</button>
      <button class="tab flex-1 min-w-[90px] py-2.5 px-4 text-xs lg:text-sm font-bold rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-white transition-all hover:bg-slate-200/50 dark:hover:bg-slate-800/50" data-tab="backtest">Backtest</button>
      <button class="tab flex-1 min-w-[90px] py-2.5 px-4 text-xs lg:text-sm font-bold rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-white transition-all hover:bg-slate-200/50 dark:hover:bg-slate-800/50" data-tab="validation">Validación</button>
      <button class="tab flex-1 min-w-[90px] py-2.5 px-4 text-xs lg:text-sm font-bold rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-white transition-all hover:bg-slate-200/50 dark:hover:bg-slate-800/50" data-tab="ml">IA / ML</button>
      <button class="tab flex-1 min-w-[90px] py-2.5 px-4 text-xs lg:text-sm font-bold rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-white transition-all hover:bg-slate-200/50 dark:hover:bg-slate-800/50" data-tab="news">Noticias</button>
      <button class="tab flex-1 min-w-[90px] py-2.5 px-4 text-xs lg:text-sm font-bold rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-white transition-all hover:bg-slate-200/50 dark:hover:bg-slate-800/50" data-tab="broker">Broker</button>
    </nav>
    
    <!-- Paneles de Contenido -->
    <div id="tab-content" class="space-y-6">
      
      <!-- Panel Asesor -->
      <section id="panel-advisor" class="panel active flex flex-col gap-6">
        <!-- Renderizado dinámicamente -->
      </section>
      
      <!-- Panel Gráficos -->
      <section id="panel-chart" class="panel hidden flex flex-col gap-6">
        <div class="glass rounded-2xl p-6 panel-hover-neon transition-all duration-500">
          <h3 class="text-lg font-bold font-outfit mb-4 flex items-center gap-2">Evolución del Precio y Volúmenes</h3>
          <div id="price-chart-container" class="chart-container-wrapper"></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="glass rounded-2xl p-6 panel-hover-neon transition-all duration-500">
            <h3 class="text-base font-bold font-outfit mb-4 text-slate-700 dark:text-slate-200">Fuerza Relativa (RSI 14)</h3>
            <div id="rsi-chart-container" class="chart-container-wrapper-sub"></div>
          </div>
          <div class="glass rounded-2xl p-6 panel-hover-neon transition-all duration-500">
            <h3 class="text-base font-bold font-outfit mb-4 text-slate-700 dark:text-slate-200">Impulso de Tendencia (MACD)</h3>
            <div id="macd-chart-container" class="chart-container-wrapper-sub"></div>
          </div>
        </div>
      </section>
      
      <!-- Panel Señales -->
      <section id="panel-signals" class="panel hidden flex flex-col gap-4">
        <!-- Renderizado dinámicamente -->
      </section>
      
      <!-- Panel Backtest -->
      <section id="panel-backtest" class="panel hidden flex flex-col gap-6">
        <!-- Renderizado dinámicamente -->
      </section>
      
      <!-- Panel Portafolio -->
      <section id="panel-portfolio" class="panel hidden flex flex-col gap-6">
        <!-- Renderizado dinámicamente -->
      </section>
      
      <!-- Panel Validación -->
      <section id="panel-validation" class="panel hidden flex flex-col gap-6">
        <!-- Renderizado dinámicamente -->
      </section>
      
      <!-- Panel ML -->
      <section id="panel-ml" class="panel hidden flex flex-col gap-6">
        <!-- Renderizado dinámicamente -->
      </section>

      <!-- Panel Noticias -->
      <section id="panel-news" class="panel hidden flex flex-col gap-6">
        <!-- Renderizado dinámicamente -->
      </section>

      <!-- Panel Broker -->
      <section id="panel-broker" class="panel hidden flex flex-col gap-6">
        <!-- Renderizado dinámicamente -->
      </section>
      
    </div>
  </main>
  
  <!-- Toasts -->
  <div id="toast-container" class="toast-container text-sm"></div>

  <!-- JS -->
  <script src="/static/js/api.js?v=6"></script>
  <script src="/static/js/charts.js?v=6"></script>
  <script src="/static/js/components.js?v=6"></script>
  <script src="/static/js/app.js?v=6"></script>
</body>
</html>
