<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance — InvestPro</title>
  <script>(function(){var t=localStorage.getItem('investpro-theme');document.documentElement.className=t==='light'?'light':'dark'})();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-bold">Monitoreo en Vivo</h1>
        <p class="text-gray-500 dark:text-gray-400 mt-1" id="last-update">Conectando...</p>
      </div>
      <div class="flex items-center gap-4">
        <span id="bot-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-gray-200 dark:bg-gray-700">---</span>
        <a href="/" class="text-sm text-indigo-600 dark:text-indigo-400 hover:underline">← Dashboard</a>
      </div>
    </div>

    <div id="metrics-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
      <div class="card bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-lg">
        <h3 class="text-lg font-semibold mb-4">Equity Curve</h3>
        <div id="equity-chart" style="height: 300px;"></div>
      </div>
      <div class="card bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-lg">
        <h3 class="text-lg font-semibold mb-4">Drawdown</h3>
        <div id="drawdown-chart" style="height: 300px;"></div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
      <div class="card bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-lg">
        <h3 class="text-lg font-semibold mb-4">Posiciones Activas</h3>
        <div id="positions-panel" class="text-sm text-gray-500 dark:text-gray-400">Sin posiciones activas.</div>
      </div>
      <div class="card bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-lg">
        <h3 class="text-lg font-semibold mb-4">Rolling Metrics (30d)</h3>
        <div id="rolling-chart" style="height: 300px;"></div>
      </div>
    </div>

    <div class="card bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-lg">
      <h3 class="text-lg font-semibold mb-4">Trade Log</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="text-gray-500 dark:text-gray-400 border-b dark:border-gray-700">
            <tr>
              <th class="pb-2">Ticker</th>
              <th class="pb-2">Side</th>
              <th class="pb-2">Entry</th>
              <th class="pb-2">Exit</th>
              <th class="pb-2">P&L</th>
              <th class="pb-2">Hold</th>
              <th class="pb-2">Reason</th>
            </tr>
          </thead>
          <tbody id="trade-body" class="divide-y dark:divide-gray-700"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let eqChart, ddChart, rollChart, eqSeries, ddSeries;

    async function load() {
      try {
        const data = await fetch('/api/performance/live').then(r => r.json());
        document.getElementById('last-update').textContent = 'Última actualización: ' + new Date().toLocaleTimeString();

        // Bot status badge
        const badge = document.getElementById('bot-badge');
        if (data.bot_status === 'running') { badge.textContent = '● EN VIVO'; badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400'; }
        else if (data.bot_status === 'stopped') { badge.textContent = '● DETENIDO'; badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400'; }
        else { badge.textContent = '○ INACTIVO'; badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-gray-200 text-gray-500 dark:bg-gray-700 dark:text-gray-400'; }

        // Metrics
        renderMetrics(data.metrics);
        renderPositions(data.active_positions);
        renderCharts(data.equity_curve || []);
      } catch (e) {
        document.getElementById('last-update').textContent = 'Error: ' + e.message;
        document.getElementById('bot-badge').textContent = '○ SIN CONEXIÓN';
      }
    }

    function renderMetrics(m) {
      if (!m || !Object.keys(m).length) {
        document.getElementById('metrics-grid').innerHTML = '<div class="col-span-4 text-center text-gray-400 py-8">Esperando datos del bot...</div>';
        return;
      }
      const items = [
        { label: 'Sharpe (30d)', value: m.sharpe_30d?.toFixed(2) || 'N/A', color: (m.sharpe_30d || 0) >= 1 ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600 dark:text-red-400' },
        { label: 'Win Rate (30d)', value: m.win_rate_30d ? (m.win_rate_30d * 100).toFixed(1) + '%' : 'N/A', color: (m.win_rate_30d || 0) >= 0.5 ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600 dark:text-red-400' },
        { label: 'Max DD (30d)', value: m.max_dd_30d ? (m.max_dd_30d * 100).toFixed(1) + '%' : 'N/A', color: 'text-red-600 dark:text-red-400' },
        { label: 'Profit Factor', value: m.profit_factor_30d?.toFixed(2) || 'N/A', color: (m.profit_factor_30d || 0) >= 1.5 ? 'text-emerald-600 dark:text-emerald-400' : 'text-gray-600 dark:text-gray-400' },
        { label: 'Kelly %', value: m.rolling_kelly ? (m.rolling_kelly * 100).toFixed(1) + '%' : 'N/A', color: 'text-blue-600 dark:text-blue-400' },
        { label: 'Avg Win', value: m.avg_win_30d ? (m.avg_win_30d * 100).toFixed(2) + '%' : 'N/A', color: 'text-emerald-600 dark:text-emerald-400' },
        { label: 'Avg Loss', value: m.avg_loss_30d ? (m.avg_loss_30d * 100).toFixed(2) + '%' : 'N/A', color: 'text-red-600 dark:text-red-400' },
      ];
      document.getElementById('metrics-grid').innerHTML = items.map(i =>
        `<div class="bg-white dark:bg-gray-800 rounded-2xl p-5 text-center shadow-lg">
          <div class="text-2xl font-bold ${i.color}">${i.value}</div>
          <div class="text-sm text-gray-500 dark:text-gray-400 mt-1">${i.label}</div>
        </div>`
      ).join('');
    }

    function renderPositions(positions) {
      const panel = document.getElementById('positions-panel');
      if (!positions || !positions.length) {
        panel.innerHTML = '<div class="text-gray-400">Sin posiciones activas.</div>';
        return;
      }
      panel.innerHTML = positions.map(p =>
        `<div class="flex justify-between items-center py-2 border-b dark:border-gray-700 last:border-0">
          <span class="font-semibold">${p.ticker || p.symbol || '?'}</span>
          <span class="${(p.unrealized_pl || 0) >= 0 ? 'text-emerald-500' : 'text-red-500'}">
            ${p.side || 'LONG'} · $${(p.market_value || 0).toFixed(2)} · ${((p.unrealized_pl_pct || 0) * 100).toFixed(2)}%
          </span>
        </div>`
      ).join('');
    }

    function renderCharts(equityData) {
      const isDark = document.documentElement.classList.contains('dark');
      const textColor = isDark ? '#9CA3AF' : '#6B7280';
      const gridColor = isDark ? '#374151' : '#E5E7EB';
      if (!equityData || !equityData.length) return;

      const sorted = [...equityData].reverse();

      if (!eqChart) {
        eqChart = LightweightCharts.createChart(document.getElementById('equity-chart'), {
          layout: { textColor, background: { type: 'solid', color: 'transparent' } },
          grid: { vertLines: { color: gridColor }, horzLines: { color: gridColor } },
          crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
          rightPriceScale: { borderColor: gridColor }, timeScale: { borderColor: gridColor },
        });
        eqSeries = eqChart.addLineSeries({ color: '#6366f1', lineWidth: 2 });
      }
      eqSeries.setData(sorted.map(d => ({ time: d.date, value: d.equity })));
      eqChart.timeScale().fitContent();

      if (!ddChart) {
        ddChart = LightweightCharts.createChart(document.getElementById('drawdown-chart'), {
          layout: { textColor, background: { type: 'solid', color: 'transparent' } },
          grid: { vertLines: { color: gridColor }, horzLines: { color: gridColor } },
          rightPriceScale: { borderColor: gridColor }, timeScale: { borderColor: gridColor },
        });
        ddSeries = ddChart.addAreaSeries({ color: '#ef4444', lineWidth: 2, topColor: 'rgba(239,68,68,0.3)', bottomColor: 'rgba(239,68,68,0.0)' });
      }
      let peak = sorted[0]?.equity || 0;
      const ddData = sorted.map(d => {
        if (d.equity > peak) peak = d.equity;
        return { time: d.date, value: peak > 0 ? (d.equity - peak) / peak : 0 };
      });
      ddSeries.setData(ddData);
      ddChart.timeScale().fitContent();
    }

    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
